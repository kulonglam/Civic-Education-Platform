services:
  - type: web
    name: civic-education-api
    runtime: python
    plan: starter
    # Free-tier hosts often lack Shell — migrate + seed run on every deploy instead.
    buildCommand: pip install -r backend/requirements.txt && cd backend && python manage.py migrate --noinput && python manage.py seed_data && python manage.py collectstatic --noinput
    startCommand: cd backend && python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/ready/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: civic-education-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: civic-education-redis
          type: redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: civic-education-redis
          type: redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: BILLING_PROVIDER
        value: dummy
      - key: ALLOW_DUMMY_BILLING_IN_PRODUCTION
        value: "True"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_REDIRECT_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_ADMIN_EMAIL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: REQUIRE_SENTRY
        value: "False"
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: AUDIT_WORM_PATH
        sync: false
      - key: WHATSAPP_PROVIDER
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANG
        sync: false
      - key: SUPPORT_EMAIL
        sync: false

  - type: cron
    name: civic-education-backup
    runtime: python
    plan: starter
    schedule: "0 3 * * *"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python manage.py backup_database
    disk:
      name: civic-education-backups
      mountPath: /var/data/backups
      sizeGB: 10
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          name: civic-education-api
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: civic-education-db
          property: connectionString
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_RETAIN_DAYS
        value: "14"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: AUDIT_WORM_PATH
        value: /var/data/backups/audit-worm.jsonl

  - type: cron
    name: civic-education-audit-purge
    runtime: python
    plan: starter
    schedule: "0 4 * * 0"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python manage.py purge_audit_logs
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          name: civic-education-api
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: civic-education-db
          property: connectionString

  - type: worker
    name: civic-education-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && celery -A config worker --loglevel=info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          name: civic-education-api
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: civic-education-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: civic-education-redis
          type: redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: civic-education-redis
          type: redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: FRONTEND_URL
        fromService:
          name: civic-education-api
          type: web
          envVarKey: FRONTEND_URL
      - key: REQUIRE_SENTRY
        fromService:
          name: civic-education-api
          type: web
          envVarKey: REQUIRE_SENTRY
      - key: SENTRY_DSN
        fromService:
          name: civic-education-api
          type: web
          envVarKey: SENTRY_DSN
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: BILLING_PROVIDER
        value: dummy
      - key: ALLOW_DUMMY_BILLING_IN_PRODUCTION
        value: "True"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_ADMIN_EMAIL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: web
    name: civic-education-web
    runtime: static
    plan: starter
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_DEFAULT_TENANT_SLUG
        value: platform-demo
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: redis
    name: civic-education-redis
    plan: starter
    ipAllowList: []

databases:
  - name: civic-education-db
    plan: starter
    databaseName: civic_education
    user: civic_education
