<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/civic-education-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#047857" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Civic education for citizens of South Sudan — learn offline anytime." />
    <link rel="apple-touch-icon" href="/civic-education-logo.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preload" as="image" href="/hero-civic.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CivicHub" />
    <meta property="og:description" content="Civic education for citizens of South Sudan — learn offline anytime." />
    <meta property="og:image" content="/civic-education-logo.png" />
    <meta property="og:site_name" content="CivicHub" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CivicHub" />
    <meta name="twitter:description" content="Civic education for citizens of South Sudan — learn offline anytime." />
    <meta name="twitter:image" content="/civic-education-logo.png" />

    <title>CivicHub</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('cep_a11y');
          if (!raw) return;
          var settings = JSON.parse(raw);
          var root = document.documentElement;
          if (settings.fontScale && settings.fontScale !== 'md') {
            root.setAttribute('data-font-size', settings.fontScale);
          }
          if (settings.highContrast) {
            root.setAttribute('data-contrast', 'high');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
