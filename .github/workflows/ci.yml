name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install security tools
        run: pip install bandit==1.9.4 safety==3.8.1

      - name: SAST – Bandit
        working-directory: backend
        run: |
          bandit -r apps/ -f json -o bandit-report.json --exit-zero
          bandit -r apps/ -ll -ii  # fail only on HIGH severity + HIGH confidence

      - name: Dependency scan – Safety
        working-directory: backend
        run: safety check -r requirements.txt --full-report

      # gitleaks-action@v2 runs on Node 20, which GitHub-hosted runners reject
      # as of June 2026. The CLI is free and does not need GITLEAKS_LICENSE.
      - name: Secret scanning – Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          /tmp/gitleaks detect --source . --verbose --redact --exit-code 1

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests (with coverage)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: pytest -q --cov=apps --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=80

      - name: Production deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: pytest tests/test_deploy.py -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (mocked API)
        run: npm run test:e2e

  e2e-live:
    name: E2E (live backend)
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civic_education
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/civic_education
      DJANGO_SETTINGS_MODULE: config.settings.development
      CELERY_TASK_ALWAYS_EAGER: "True"
      SECRET_KEY: ci-e2e-secret-key
      E2E_LIVE: "1"
      E2E_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Prepare backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py migrate
          python manage.py seed_data

      - name: Verify backend health (smoke)
        working-directory: backend
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health/ && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/ready/
          kill $SERVER_PID || true
          wait $SERVER_PID 2>/dev/null || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Live E2E tests
        run: npm run test:e2e:live

  loadtest:
    name: Load test gate (Locust)
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civic_education
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/civic_education
      DJANGO_SETTINGS_MODULE: config.settings.test
      CELERY_TASK_ALWAYS_EAGER: "True"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare database
        run: |
          python manage.py migrate
          python manage.py seed_data

      - name: Start API server
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health/ && break
            sleep 1
          done

      - name: Smoke check API
        run: python manage.py smoke_check --base-url http://127.0.0.1:8000

      - name: Integration status (local)
        run: python manage.py check_integrations --json

      - name: Run Locust CI gate
        run: >
          python loadtest/ci_gate.py
          --host http://127.0.0.1:8000
          --users 8
          --spawn-rate 2
          --run-time 20s
          --max-fail-ratio 0.05
          --max-p95-ms 2500

  disaster-recovery:
    name: Disaster recovery drill
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civic_education
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/civic_education
      DJANGO_SETTINGS_MODULE: config.settings.test
      CELERY_TASK_ALWAYS_EAGER: "True"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate and seed
        run: |
          python manage.py migrate
          python manage.py seed_data

      - name: Restore drill
        run: python manage.py restore_database_drill
